plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.markdave.suntukan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.markdave.suntukan'
        minSdk 24
        targetSdk 35
        versionCode runNo
        versionName "1.0.${runNo}"
    }

    signingConfigs {
        stable {
            storeFile file('suntukan.keystore')
            storePassword 'suntukan123'
            keyAlias 'suntukan'
            keyPassword 'suntukan123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
